[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-designer-mcp-server"
version = "1.0.0"
description = "MCP server for Threat Designer API"
authors = [
    {name = "Edvin Hallvaxhiu"}
]
readme = "README.md"
license = {text = "APACHE"}
requires-python = ">=3.10"
dependencies = [
    "boto3",
    # Cap below 2.0: mcp 2.0.0 removed the bundled mcp.server.fastmcp package
    # that server.py imports Context and FastMCP from, so an unbounded
    # requirement resolves to 2.x and the server dies at import. Same reason as
    # the pin in backend/sentry/requirements.txt, different relocated module.
    "mcp>=1.9.2,<2.0.0",
    "fastmcp",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pillow>=9.0.0",
]

[project.scripts]
threat-designer-mcp-server = "threat_designer_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["threat_designer_mcp*"]

[project.urls]
Homepage = "https://github.com/awslabs/threat-designer"
Repository = "https://github.com/awslabs/threat-designer"